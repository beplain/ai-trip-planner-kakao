services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tripplanner
      MYSQL_USER: tripplanner
      MYSQL_PASSWORD: tripplanner
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
